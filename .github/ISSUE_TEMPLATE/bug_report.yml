name: Bug report
description: Something in the contributor training does not work as described
labels: [bug-report]
body:
  - type: markdown
    attributes:
      value: |
        Open this in **eclipse-score/contributor_training**, not in your copy. **There is no support**: the maintainers fix the training, they do not repair copies. "When something breaks" in TRAINING.md says what you can do yourself.
  - type: input
    id: where
    attributes:
      label: Where
      description: Task, file, branch or command
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Quote the command and its output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Training version
      description: The date you made your copy, or the commit of eclipse-score/contributor_training it was made from
