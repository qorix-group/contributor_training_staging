name: Feedback
description: Tell the maintainers what should be better in the contributor training
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Open this in **eclipse-score/contributor_training**, not in your copy: nobody else can see your copy.
        The maintainers read every feedback and improve the training. **There is no support**: for questions about S-CORE itself, see "Feedback, bugs and questions" in TRAINING.md.
  - type: dropdown
    id: track
    attributes:
      label: Track
      options: [quality, safety, security, not started yet]
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What should be better
      description: One point per line. Say where (task, file, step) and what you expected.
    validations:
      required: true
