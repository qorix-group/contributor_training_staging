# Copied from eclipse-score/.github, .github/ISSUE_TEMPLATE/4_Task.yml at
# 8001e21a9f9dcd70000b84376f2895011e58348c. Changed: "(S-CORE form)" added to the name, and
# `type:` removed, because issue types exist only in an organisation and a training copy
# lives in a personal account. Keep the rest identical; see training/README.md.

name: Task (S-CORE form)
description: Issue to track a Task
title: "Your Task title"
body:
  - type: markdown
    attributes:
      value: "## <ins>Task Ticket creation</ins>"
  - type: textarea
    attributes:
      label: What
      description: |
        - Goal of the Task
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance Criteria (DoD)
      description: Details on when the Task is considered "done"
    validations:
      required: true
  - type: textarea
    attributes:
      label: How
      description: Details on implementation approach
    validations:
      required: false
